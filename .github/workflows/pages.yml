name: Publish gpssync GitHub Pages

# Deliberately manual-only. Do not add a push trigger without owner approval.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website from source directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: source

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

