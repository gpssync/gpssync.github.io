<!doctype html><html><head><meta charset="utf-8"><title>Glossary</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Glossary</h1><dl><dt id="utc">UTC</dt><dd>Coordinated Universal Time, the time base provided by GPS data.</dd><dt id="drift">Drift</dt><dd>The difference between the Windows clock and GPS time.</dd><dt id="nmea">NMEA</dt><dd>The standard text sentence format used by many GPS receivers.</dd><dt id="com-port">COM port</dt><dd>A Windows serial port assigned to the GPS receiver.</dd></dl></main></body></html>
