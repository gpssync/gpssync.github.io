<h1>Saving Settings</h1>
<p>Click Save after changing the COM port, baud rate, sync interval, drift threshold, UTC/local mode, or logging option.</p>
<p>Save applies the selected values and attempts to reopen the GPS serial port using the current COM port and baud rate.</p>
